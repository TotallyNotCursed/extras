name: PR Enforcement

on:
  pull_request:

permissions:
  contents: read

jobs:
  enforce-develop-branch:
    name: Enforce Develop Branch Target
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR targets develop branch
        run: |
          if [ "${{ github.base_ref }}" != "develop" ]; then
            echo "Pull requests must target the 'develop' branch."
            exit 1
          fi

  spotless-check:
    name: Spotless Formatting Check
    runs-on: ubuntu-latest
    needs: enforce-develop-branch
    if: github.base_ref == 'develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run Spotless check
        run: ./gradlew spotlessCheck

      - name: Fail if formatting issues found
        if: failure()
        run: |
          echo "Spotless formatting violations detected. Run './gradlew spotlessApply' locally to fix formatting and commit the changes."
          exit 1

  openrewrite-check:
    name: OpenRewrite Recipe Check
    runs-on: ubuntu-latest
    needs: enforce-develop-branch
    if: github.base_ref == 'develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run OpenRewrite dry run
        run: ./gradlew rewriteDryRun

      - name: Fail if recipe changes suggested
        if: failure()
        run: |
          echo "OpenRewrite detected suggested changes. Run './gradlew rewriteRun' locally to apply the recipes and commit the changes."
          exit 1
